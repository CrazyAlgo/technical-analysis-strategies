[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-analysis-strategies"
version = "0.1.0"
description = "Technical analysis indicators, trading strategies, backtesting, and evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
